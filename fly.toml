# fly.toml app configuration file generated for fraymus-fly-io on 2026-10-30T08:40:38Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fraymus-fly-io'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  BUYER_PIPELINE_STRICT = '1'
  DATA_DIR = '/data'
  FREE_CREDITS = '0'
  LLM_PROVIDERS = 'openai,groq'
  NODE_ENV = 'production'
  OPENAI_USER_AGENT = 'fraymus-agency/1.0'
  PORT = '3001'
  PROMPT_LLM = 'openai'
  PROMPT_LLM_BASE_URL = 'https://api.x.ai/v1'
  PROMPT_LLM_MODEL = 'grok-4.20-0309-non-reasoning'
  SHOPIFY_CREDITS_PER_PACK = '25'
  SHOPIFY_PACK_PRODUCT_ID = '8843401527492'
  SHOPIFY_SHOP_DOMAIN = 'eyeoverthink.myshopify.com'

[[mounts]]
  source = 'nodular_data'
  destination = '/data'
  initial_size = '3gb'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
